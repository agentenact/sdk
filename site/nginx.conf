server {
    listen 80;
    root /usr/share/nginx/html;

    # Next static export emits `page.html`, not `page/index.html`.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        # HTML, proofs and the verifier bundle keep their names across deploys:
        # revalidate every time (a 304 when unchanged) so no one sees a stale site.
        add_header Cache-Control "no-cache";
    }

    # Content-hashed build assets never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Agent documents (and, from P3, paid service calls) are served by the cloud api.
    # agentURIs are registered on chain as https://agentenact.io/a/<uuid>/agent.json: never move them.
    location /a/ {
        # Resolve at request time (Docker's embedded DNS), so a changed api address needs no site restart.
        resolver 127.0.0.11 valid=60s ipv6=off;
        set $api_upstream https://api.agentenact.io;
        proxy_pass $api_upstream;               # no URI part: the original /a/... path is passed as is
        proxy_ssl_server_name on;
        proxy_ssl_name api.agentenact.io;
        proxy_set_header Host api.agentenact.io;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;   # TLS ends at servel's edge in front of this nginx
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 64k;               # the api's own body cap
        # A paid call is verify + handler (30 s abort, 60 s cap) + settle (6-13 s): up to ~73 s. Cutting it at nginx's
        # default 60 s after the buyer has paid would lose the output, so wait longer than the api ever takes.
        proxy_read_timeout 120s;
        # Enactment-Record + PAYMENT-* headers measured ~2.7 KB together (2026-10-07); keep margin over the 4k default.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        # The api's status codes, bodies and Cache-Control pass through untouched:
        # no add_header here, and upstream 404s are not replaced by the site's /404.html.
        proxy_intercept_errors off;
    }

    error_page 404 /404.html;
}
